<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <div class="app">
    <header class="header">
      <div class="logo">
        <div class="logo-mark"></div>
        <div class="logo-text">
          <div class="logo-title">MESH</div>
          <div class="logo-sub">Token Helper</div>
        </div>
      </div>
      <div class="status-dot" id="statusDot"></div>
    </header>

    <div id="linkScreen" style="display:none;">
      <div class="card info">
        <div class="card-row">
          <span>Расширение не привязано к аккаунту</span>
        </div>
      </div>

      <div class="card">
        <label class="input-label" for="pairCodeInput">
          Код из личного кабинета
        </label>
        <input
          id="pairCodeInput"
          class="pin-input"
          type="text"
          maxlength="6"
          inputmode="numeric"
          placeholder="000000"
        />
        <button id="linkBtn" class="btn btn-primary">Связать</button>
        <div class="footer-hint">
          Код можно сгенерировать на странице «Расширение» в личном кабинете.
        </div>
      </div>
    </div>

    <div id="mainScreen" style="display:none;">
      <div id="statusCard" class="card info">
        <div class="card-row">
          <div class="spinner"></div>
          <span id="statusText">Проверяю токен...</span>
        </div>
      </div>

      <div id="userCard" class="card user-card" style="display:none;">
        <div class="avatar" id="avatar">?</div>
        <div class="user-info">
          <div class="user-name" id="userName"></div>
          <div class="user-meta" id="userMeta"></div>
        </div>
      </div>

      <div id="tokenInfoCard" class="card token-info" style="display:none;">
        <div class="token-row">
          <span class="token-label">Срок действия</span>
          <span class="token-value" id="tokenExpires"></span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="token-row small">
          <span id="tokenRemaining"></span>
        </div>
      </div>

      <div class="actions">
        <button id="grantBtn" class="btn btn-primary" style="display:none;">
          Разрешить доступ к МЭШ
        </button>
        <button id="refreshBtn" class="btn btn-secondary" style="display:none;">
          Обновить данные
        </button>
      </div>

      <div class="footer">
        <button id="unlinkBtn" class="link-btn">Отвязать расширение</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
